version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: landline-postgres
    environment:
      POSTGRES_USER: landline
      POSTGRES_PASSWORD: landline_secret
      POSTGRES_DB: landline_db
    ports:
      - "5432:5432"
    volumes:
      - landline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landline -d landline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: landline-redis
    ports:
      - "6379:6379"
    volumes:
      - landline_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  landline_pgdata:
  landline_redis:
