[pytest]
# Collect only from tests/. Without this, a bare `pytest` walks the repo root and
# pulls in application modules whose names match pytest's default patterns
# (`test_*.py`, `*_test.py`): `app/routers/email_test.py` defines the route
# handler `test_send`, which pytest collects as a test and then errors on when it
# tries to resolve `payload` and `db` as fixtures. The endpoint is named
# correctly for what it does — send a test email — and renaming it would change
# its generated OpenAPI operationId for a test-runner reason, so the collection
# scope is what gets fixed. `pytest tests/ -v` (the documented invocation) always
# worked; this makes the bare command agree with it.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
