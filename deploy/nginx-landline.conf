# Nginx reverse proxy for Landline API
# Place in /etc/nginx/sites-available/forge and symlink to sites-enabled
#
# This config runs Landline API on a separate port (8443) from the existing
# Apprend backend, so the two don't interfere.

upstream landline_api {
    server 127.0.0.1:8001;
}

server {
    listen 8443 ssl;
    server_name 100.30.136.86 landline-api.apprendtechnologies.com;

    # Re-use existing SSL certs or use self-signed for staging
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # For staging: generate self-signed cert
    ssl_certificate /etc/nginx/ssl/landline-staging.crt;
    ssl_certificate_key /etc/nginx/ssl/landline-staging.key;

    client_max_body_size 10M;

    location / {
        proxy_pass http://landline_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://landline_api/health;
        access_log off;
    }
}

# Optional: redirect HTTP to HTTPS
server {
    listen 8080;
    server_name 100.30.136.86 landline-api.apprendtechnologies.com;
    return 301 https://$host:8443$request_uri;
}
