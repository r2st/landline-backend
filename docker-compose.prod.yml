version: "3.9"

# Production docker-compose for Landline backend on EC2
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: landline-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-landline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-landline_db}
    ports:
      - "127.0.0.1:5433:5432"  # 5433 to avoid conflict with any existing PG
    volumes:
      - landline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landline} -d ${POSTGRES_DB:-landline_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: landline-redis
    restart: always
    ports:
      - "127.0.0.1:6380:6379"  # 6380 to avoid conflict with any existing Redis
    volumes:
      - landline_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landline-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-landline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-landline_db}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      APP_ENV: "staging"
    ports:
      - "127.0.0.1:8001:8000"  # 8001 externally, nginx will proxy to this
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landline-celery
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-landline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-landline_db}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      APP_ENV: "staging"
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  landline_pgdata:
  landline_redis:
