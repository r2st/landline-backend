# Production Compose for Landline backend.
# Application services run from a prebuilt image. Build on a workstation or CI,
# set LANDLINE_IMAGE, then pull/run on the server.

x-landline-image: &landline_image ${LANDLINE_IMAGE:-backend-celery-worker:latest}

services:
  postgres:
    image: postgres:16-alpine
    container_name: landline-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-landline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-landline_db}
    ports:
      - "127.0.0.1:5433:5432"  # 5433 to avoid conflict with any existing PG
    volumes:
      - landline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landline} -d ${POSTGRES_DB:-landline_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: landline-redis
    restart: always
    ports:
      - "127.0.0.1:6382:6379"  # 6382 to avoid conflict with existing Redis
    volumes:
      - landline_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: *landline_image
    container_name: landline-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-landline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-landline_db}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      APP_ENV: "staging"
      # Rate-limit counters go in Redis, not process memory: the API runs
      # `uvicorn --workers 2`, so in-memory counters enforce every limit twice
      # over and which worker a request lands on decides when it trips.
      RATELIMIT_STORAGE_URI: "redis://redis:6379/2"
      # Exactly one reverse proxy (nginx) is in front, and it publishes to a
      # loopback-bound port so nothing else can reach this container. That is
      # what makes the last X-Forwarded-For entry — the one nginx appended —
      # the real caller. Without this the peer address is the Docker bridge
      # gateway for every request on the internet, and the 10/minute login
      # limit becomes a platform-wide lockout anyone can trigger. See
      # app/rate_limit.py:client_ip.
      TRUSTED_PROXY_HOPS: "1"
    ports:
      - "127.0.0.1:8001:8000"  # 8001 externally, nginx will proxy to this
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  celery-worker:
    image: *landline_image
    container_name: landline-celery
    restart: always
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-landline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-landline_db}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      APP_ENV: "staging"
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=info", "--concurrency=1", "-Q", "celery,outreach,scraping,enrichment"]
    # Override Dockerfile HEALTHCHECK - Celery has no HTTP server on :8000.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5 2>&1 | grep -q pong || exit 1"]
      interval: 300s
      timeout: 20s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  landline_pgdata:
  landline_redis:
